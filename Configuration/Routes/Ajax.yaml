routes:
  - route: api/storefinder
    type: staticText
    content: '{"message": "Store Finder Ajax Api"}'

routeEnhancers:
  StoreFinderAjax:
    type: Simple
    routePath: '/api/storefinder/{action}/{content}'
    requirements:
      action: '(categories|locations)'
      contentUid: '[0-9].*'
    _arguments:
      action: 'action'
      content: 'contentUid'
